[package]
name = "rusthashtool"
version = "0.1.0"
edition = "2021"
description = "A hashcat-like wordlist password cracker written in Rust"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
bcrypt = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
